info:
  name: Standby Message Status Update
  type: http
  seq: 25

http:
  method: VIEW
  url: http://
  body:
    type: json
    data: |-
      {
        "object": "whatsapp_business_account",
        "entry": [
          {
            "id": "WHATSAPP_BUSINESS_ACCOUNT_ID",
            "changes": [
              {
                "field": "standby",
                "value": {
                  "messaging_product": "whatsapp",
                  "metadata": {
                    "display_phone_number": "16505553333",
                    "phone_number_id": "PHONE_NUMBER_ID"
                  },
                  "standby": {
                    "contacts": [
                      {
                        "wa_id": "16315551234",
                        "user_id": "USER_ID"
                      }
                    ],
                    "statuses": [
                      {
                        "id": "wamid.STANDBY_OUTBOUND",
                        "status": "delivered",
                        "timestamp": "1790807001",
                        "recipient_id": "16315551234",
                        "recipient_user_id": "USER_ID"
                      }
                    ]
                  }
                }
              }
            ]
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Observed sent, delivered, and read status shape while Business AI standby
  routing is active. Statuses are nested below `value.standby`, and their
  message IDs refer to outbound `message_echoes`. The observed `read` event
  means the customer read the Business AI response; it does not acknowledge
  the Business AI reading an inbound customer message.
