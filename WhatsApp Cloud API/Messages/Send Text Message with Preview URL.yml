info:
  name: Send Text Message with Preview URL
  type: http
  seq: 4

http:
  method: POST
  url: https://graph.facebook.com/{{Version}}/{{Phone-Number-ID}}/messages
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "messaging_product": "whatsapp",
          "recipient_type": "individual",
          "to": "{{Recipient-Phone-Number}}",
          "type": "text",
          "text": {
              "preview_url": true,
              "body": "Please visit https://youtu.be/hpltvTEiRrY to inspire your day!"
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Send Text Message with Preview URL
    request:
      url: https://graph.facebook.com/{{Version}}/{{Phone-Number-ID}}/messages
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{User-Access-Token}}
      body:
        type: json
        data: |-
          {
              "messaging_product": "whatsapp",
              "recipient_type": "individual",
              "to": "{{Recipient-Phone-Number}}",
              "type": "text",
              "text": {
                  "preview_url": true,
                  "body": "Please visit https://youtu.be/hpltvTEiRrY."
              }
          }
    response:
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "messaging_product": "whatsapp",
            "contacts": [{
                "input": "15555551234",
                "wa_id": "<WHATSAPP_ID>"
              }],
            "messages": [{
                "id": "wamid.ID"
              }]
          }

docs: |-
  Set `text.preview_url` to `true` to ask the WhatsApp client to render a preview
  for the first `http://` or `https://` URL in the message body. If the preview
  cannot be retrieved, the URL remains clickable.

  Canonical guide: [Text messages](https://developers.facebook.com/documentation/business-messaging/whatsapp/messages/text-messages).
