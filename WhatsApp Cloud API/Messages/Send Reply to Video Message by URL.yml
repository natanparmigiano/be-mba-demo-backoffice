info:
  name: Send Reply to Video Message by URL
  type: http
  seq: 25

http:
  method: POST
  url: https://graph.facebook.com/{{Version}}/{{Phone-Number-ID}}/messages
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "messaging_product": "whatsapp",
          "recipient_type": "individual",
          "to": "{{Recipient-Phone-Number}}",
          "context": {
              "message_id": "<MSGID_OF_MSG_YOU_ARE_REPLYING_TO>"
          },
          "type": "video",
          "video": {
              "link": "<http(s)://video-url>",
              "caption": "<VIDEO_CAPTION_TEXT>"
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Send Reply to Video Message by URL
    request:
      url: https://graph.facebook.com/{{Version}}/{{Phone-Number-ID}}/messages
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value: Bearer {{User-Access-Token}}
      body:
        type: json
        data: |-
          {
              "messaging_product": "whatsapp",
              "recipient_type": "individual",
              "to": "{{Recipient-Phone-Number}}",
              "context": {
                  "message_id": "<MSGID_OF_MSG_YOU_ARE_REPLYING_TO>"
              },
              "type": "video",
              "video": {
                  "link": "<http(s)://video-url>",
                  "caption": "<VIDEO_CAPTION_TEXT>"
              }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "messaging_product": "whatsapp",
              "contacts": [
                  {
                      "input": "48XXXXXXXXX",
                      "wa_id": "48XXXXXXXXX "
                  }
              ],
              "messages": [
                  {
                      "id": "wamid.gBGGSFcCNEOPAgkO_KJ55r4w_ww"
                  }
              ]
          }

docs: |-
  To send a video link as a reply to message, make a **POST** call to **`/{{Phone-Number-ID}}/messages`** and attach a media object with type = `video`. Then, be sure to include the link to the video.

  Assign **`context.message_id`** the message ID of the message you want to reply to.

  ## Request Parameters

  | Parameter | Description |
  |---|---|
  | **`messaging_product`** | **Required**<br/>Messaging service used for the request. Use `"whatsapp"`.
  | **`context.message_id`** | **Required for context object**<br/>Specifies the ID of the message you are replying to. |
  | **`type`** | **Required**<br/> Specifies the media type. Use "video".|
  | **`video.link`** | Specifies the link to the video you are sending for your reply. |

  For more information about the `Media Object` structure, see [Media Object](https://developers.facebook.com/docs/whatsapp/cloud-api/reference/messages#media-object).

  ## Response

  A successful response includes an object with an identifier prefixed with **`wamid`**. Use the ID listed after **`wamid`** to track your message status.
