docs:
  content: |-
    Flow management covers creation and cloning, retrieval, metadata and JSON
    asset updates, previews, publishing, deprecation, deletion, migration,
    endpoint metrics, and endpoint encryption keys. Flow message delivery is
    represented separately under **Send Flow**.

    Canonical references:

    - [WhatsApp Flows](https://developers.facebook.com/docs/whatsapp/flows/)
    - [Flows API](https://developers.facebook.com/docs/whatsapp/flows/guides/flowsapi/)
    - [Flow JSON](https://developers.facebook.com/docs/whatsapp/flows/reference/flowjson/)
    - [Implementing a Flow endpoint](https://developers.facebook.com/docs/whatsapp/flows/guides/implementingyourflowendpoint/)
  type: text/markdown
