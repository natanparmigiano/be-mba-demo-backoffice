info:
  name: Upsert authentication templates
  type: http
  seq: 18

http:
  method: POST
  url: https://graph.facebook.com/{{Version}}/{{WABA-ID}}/upsert_message_templates
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "authentication_code_copy_code_button",
        "languages": ["en_US", "pt_BR"],
        "category": "AUTHENTICATION",
        "components": [
          { "type": "BODY", "add_security_recommendation": true },
          { "type": "FOOTER", "code_expiration_minutes": 10 },
          {
            "type": "BUTTONS",
            "buttons": [{ "type": "OTP", "otp_type": "COPY_CODE" }]
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Creates or updates authentication templates with the same name in multiple
  languages. Existing name/language pairs are updated; missing pairs are created.

  Canonical guide: [Authentication template bulk management](https://developers.facebook.com/documentation/business-messaging/whatsapp/templates/authentication-templates/bulk-management).
