docs: |-
  Replaces the supplied template components and updates other editable fields.
  The canonical endpoint also accepts `category`, `parameter_format`,
  `allow_category_change`, `cta_url_link_tracking_opted_out`,
  `message_send_ttl_seconds`, `sub_category`, `display_format`, and
  `is_primary_device_delivery_only`. Template name and language are immutable.

  - [Template management guide](https://developers.facebook.com/documentation/business-messaging/whatsapp/templates/template-management#edit-templates)
  - [Message Templates API reference](https://developers.facebook.com/documentation/business-messaging/whatsapp/reference/whatsapp-business-account/message-template-api#post-version-template-id)
