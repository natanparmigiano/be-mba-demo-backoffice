info:
  name: Delete template group
  type: http
  seq: 4

http:
  method: DELETE
  url: https://graph.facebook.com/{{Version}}/<TEMPLATE_GROUP_ID>
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Deletes the group without deleting its associated templates.

  Canonical guide: [Delete a template group](https://developers.facebook.com/documentation/business-messaging/whatsapp/templates/template-groups#delete-a-template-group).
