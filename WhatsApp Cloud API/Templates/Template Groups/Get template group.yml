info:
  name: Get template group
  type: http
  seq: 2

http:
  method: GET
  url: https://graph.facebook.com/{{Version}}/<TEMPLATE_GROUP_ID>
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Returns a template group and its associated WABA and templates.

  Canonical guide: [Get a template group](https://developers.facebook.com/documentation/business-messaging/whatsapp/templates/template-groups#get-a-template-group).
