info:
  name: Update template group
  type: http
  seq: 3

http:
  method: POST
  url: https://graph.facebook.com/{{Version}}/<TEMPLATE_GROUP_ID>
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Black Friday 2026",
        "description": "Updated campaign templates.",
        "add_templates": ["{{Template-ID-3}}"],
        "remove_templates": ["{{Template-ID-1}}"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Updates group metadata and adds or removes template IDs. Removing a template
  does not remove metrics it already contributed to the group.

  Canonical guide: [Update a template group](https://developers.facebook.com/documentation/business-messaging/whatsapp/templates/template-groups#update-a-template-group).
