info:
  name: Browse template library
  type: http
  seq: 20

http:
  method: GET
  url: https://graph.facebook.com/{{Version}}/message_template_library?search=delivery&language=en_US
  params:
    - name: search
      value: delivery
      type: query
    - name: language
      value: en_US
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Browses Meta's pre-written Template Library. Filters include `search`, `topic`,
  `usecase`, `industry`, `language`, and `name`.

  Canonical guide: [Template Library](https://developers.facebook.com/documentation/business-messaging/whatsapp/templates/template-library#searching-and-filtering-available-templates).
