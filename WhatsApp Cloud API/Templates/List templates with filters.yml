info:
  name: List templates with filters
  type: http
  seq: 16

http:
  method: GET
  url: https://graph.facebook.com/{{Version}}/{{WABA-ID}}/message_templates?fields=name,language,category,status,components&status=APPROVED&limit=5
  params:
    - name: fields
      value: name,language,category,status,components
      type: query
    - name: status
      value: APPROVED
      type: query
    - name: limit
      value: "5"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Lists templates with field selection, filtering, result limits, and Graph API
  cursor pagination. The endpoint also accepts `name`, `language`, `category`,
  `before`, and `after`.

  Canonical guide: [Template management](https://developers.facebook.com/documentation/business-messaging/whatsapp/templates/template-management#get-templates).
