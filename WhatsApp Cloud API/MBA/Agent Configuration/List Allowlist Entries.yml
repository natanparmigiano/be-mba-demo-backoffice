info:
  name: List Allowlist Entries
  type: http
  seq: 5

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/allowlist
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Lists consumers allowed to use an `ALLOWLISTED_ONLY` agent. Each allowlist operation has a separate 1,000 requests-per-hour limit per app.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/onboard/agent-allowlist
