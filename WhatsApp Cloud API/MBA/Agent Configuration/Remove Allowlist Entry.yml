info:
  name: Remove Allowlist Entry
  type: http
  seq: 7

http:
  method: DELETE
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/allowlist/{{MBA-Allowlist-Entry-ID}}
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Removes the entry identified by an ID returned from the add or list request.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/onboard/agent-allowlist
