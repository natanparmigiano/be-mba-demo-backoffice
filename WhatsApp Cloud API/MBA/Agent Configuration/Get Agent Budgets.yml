info:
  name: Get Agent Budgets
  type: http
  seq: 8

http:
  method: GET
  url: https://api.facebook.com/{{Business-ID}}/agent_budget
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Retrieves budgets for the Business Manager ID. Unlike other MBA calls, this path does not use the phone number ID. Reads and writes share a 1,000 requests-per-hour limit.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/agent-budget
