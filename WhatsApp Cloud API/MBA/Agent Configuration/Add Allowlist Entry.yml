info:
  name: Add Allowlist Entry
  type: http
  seq: 6

http:
  method: POST
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/allowlist
  headers:
    - name: X-API-Version
      value: 2.0.0
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "consumer_phone_number": "{{Recipient-Phone-Number}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Adds one WhatsApp consumer phone number in E.164 format. A WhatsApp entity can have up to 20 entries.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/onboard/agent-allowlist
