info:
  name: Replace Agent Budgets
  type: http
  seq: 9

http:
  method: POST
  url: https://api.facebook.com/{{Business-ID}}/agent_budget
  headers:
    - name: X-API-Version
      value: 2.0.0
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "budgets": [
          {
            "unit_type": "ai_turn",
            "time_window": "one_day",
            "max_budget": 1000
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Replaces the complete budget set. Existing budgets omitted from the body are removed; an empty array removes every cap.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/agent-budget
