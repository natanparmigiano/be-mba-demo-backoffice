info:
  name: Delete Agent
  type: http
  seq: 10

http:
  method: DELETE
  url: https://api.facebook.com/{{Phone-Number-ID}}/delete_agent
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Permanently removes the Meta Business Agent configuration from the WhatsApp phone number.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/delete-agent/delete-agent
