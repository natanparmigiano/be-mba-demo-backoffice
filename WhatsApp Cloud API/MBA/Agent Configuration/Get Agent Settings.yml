info:
  name: Get Agent Settings
  type: http
  seq: 3

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/settings
  headers:
    - name: X-API-Version
      value: 2.0.0
  params:
    - name: agent_id
      value: "{{MBA-Agent-ID}}"
      type: query
      disabled: true
      description: Optional agent settings ID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Retrieves all settings for the channel, or one configuration when `agent_id` is enabled.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/onboard/agent-settings
