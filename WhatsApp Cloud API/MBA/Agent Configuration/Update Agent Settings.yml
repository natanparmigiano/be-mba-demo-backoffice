info:
  name: Update Agent Settings
  type: http
  seq: 4

http:
  method: PUT
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/settings
  headers:
    - name: X-API-Version
      value: 2.0.0
    - name: Content-Type
      value: application/json
  params:
    - name: agent_id
      value: "{{MBA-Agent-ID}}"
      type: query
      disabled: true
      description: Optional agent settings ID
  body:
    type: json
    data: |-
      {
        "rollout": {
          "enabled": false
        },
        "ai_audience": "ALLOWLISTED_ONLY",
        "handoff": {
          "enabled": true,
          "message_selection": "DEFAULT"
        },
        "followup": {
          "enabled": false,
          "followup_interval_in_seconds": 0
        },
        "never_say_phrases": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Partially updates settings; omitted fields retain their current values. The sample keeps rollout disabled and limits the audience to allowlisted consumers.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/onboard/agent-settings
