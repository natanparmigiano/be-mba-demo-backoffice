info:
  name: Get Business Info
  type: http
  seq: 1

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/business_info
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Retrieves the agent's configured business information.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/agent-knowledge-business-info
