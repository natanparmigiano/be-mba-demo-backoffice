info:
  name: Get Knowledge File
  type: http
  seq: 10

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/files/{{MBA-File-ID}}
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Retrieves metadata for one knowledge file; file contents are not returned.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/agent-knowledge-files
