info:
  name: Reset Business Info
  type: http
  seq: 3

http:
  method: DELETE
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/business_info
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Clears the configured business information and restores default values.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/agent-knowledge-business-info
