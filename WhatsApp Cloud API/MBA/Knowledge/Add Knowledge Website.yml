info:
  name: Add Knowledge Website
  type: http
  seq: 15

http:
  method: POST
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/websites
  headers:
    - name: X-API-Version
      value: 2.0.0
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "url": "https://www.example.com",
        "included_sub_domains": [],
        "included_url_patterns": [],
        "excluded_sub_domains": [],
        "excluded_url_patterns": [],
        "single_urls": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Registers a website for crawling. Narrow the crawl with the optional arrays when the domain contains unrelated, regional, or multilingual content.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/agent-knowledge-websites
