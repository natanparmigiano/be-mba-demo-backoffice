info:
  name: Update Knowledge Website
  type: http
  seq: 16

http:
  method: PUT
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/websites/{{MBA-Website-ID}}
  headers:
    - name: X-API-Version
      value: 2.0.0
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "url": "https://www.example.com",
        "included_sub_domains": [],
        "included_url_patterns": [],
        "excluded_sub_domains": [],
        "excluded_url_patterns": [],
        "single_urls": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Updates the URL and crawl scope of the selected website entry.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/agent-knowledge-websites
