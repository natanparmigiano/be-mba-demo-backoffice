info:
  name: List Knowledge Websites
  type: http
  seq: 13

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/websites
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Lists website crawl entries. Website operations share a 1,000 requests-per-hour limit.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/agent-knowledge-websites
