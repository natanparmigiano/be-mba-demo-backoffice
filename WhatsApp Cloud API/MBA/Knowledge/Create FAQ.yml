info:
  name: Create FAQ
  type: http
  seq: 6

http:
  method: POST
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/faq
  headers:
    - name: X-API-Version
      value: 2.0.0
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "question": "What is your return policy?",
        "answer": "Returns are accepted within 30 days with proof of purchase.",
        "metadata": {
          "category": "returns"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Creates a focused question-and-answer knowledge entry.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/agent-knowledge-faqs
