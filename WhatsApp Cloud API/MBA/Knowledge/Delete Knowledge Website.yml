info:
  name: Delete Knowledge Website
  type: http
  seq: 17

http:
  method: DELETE
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/websites/{{MBA-Website-ID}}
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Removes the selected website and its crawled knowledge from the agent.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/agent-knowledge-websites
