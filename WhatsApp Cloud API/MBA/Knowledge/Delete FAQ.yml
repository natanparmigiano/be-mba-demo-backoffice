info:
  name: Delete FAQ
  type: http
  seq: 8

http:
  method: DELETE
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/faq/{{MBA-FAQ-ID}}
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Deletes the selected FAQ entry.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/agent-knowledge-faqs
