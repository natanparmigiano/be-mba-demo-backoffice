info:
  name: List Connector Tools
  type: http
  seq: 1

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_connectors/{{MBA-Connector-ID}}/tools
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Lists every operation the agent can invoke through the selected connector.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/connector-tools
