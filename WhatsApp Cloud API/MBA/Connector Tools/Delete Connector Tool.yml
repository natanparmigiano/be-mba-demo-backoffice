info:
  name: Delete Connector Tool
  type: http
  seq: 6

http:
  method: DELETE
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_connectors/{{MBA-Connector-ID}}/tools/{{MBA-Tool-ID}}
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Deletes the selected operation from the connector.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/connector-tools
