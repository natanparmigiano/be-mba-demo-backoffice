info:
  name: Create Connector Tool
  type: http
  seq: 3

http:
  method: POST
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_connectors/{{MBA-Connector-ID}}/tools
  headers:
    - name: X-API-Version
      value: 2.0.0
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "lookup_order",
        "description": "Use when a customer asks for an order status. Requires an order ID and returns status and delivery information.",
        "request_definition": {
          "method": "GET",
          "path": "/orders/{order_id}",
          "path_parameters": {
            "order_id": {
              "type": "string",
              "description": "The customer's order identifier."
            }
          },
          "query_parameters": {},
          "headers": {}
        },
        "user_auth_required": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Creates one operation on the selected connector. Define explicit types and descriptions for every input so the agent can construct valid requests.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/connector-tools
