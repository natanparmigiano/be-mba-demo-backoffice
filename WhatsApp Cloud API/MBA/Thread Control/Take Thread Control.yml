info:
  name: Take Thread Control
  type: http
  seq: 2

http:
  method: POST
  url: https://api.facebook.com/business/whatsapp/phone_numbers/{{Phone-Number-ID}}/thread_control
  headers:
    - name: X-API-Version
      value: 1.0.0
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "messaging_product": "whatsapp",
        "action": "take",
        "to": "{{MBA-Consumer-ID}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Takes control of a WhatsApp conversation from the Business AI for human
  escalation. This endpoint specifically requires `X-API-Version: 1.0.0`.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/operate/thread-control-cloud-api
