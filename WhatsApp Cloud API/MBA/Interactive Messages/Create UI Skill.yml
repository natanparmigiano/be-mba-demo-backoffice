info:
  name: Create UI Skill
  type: http
  seq: 3

http:
  method: POST
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent-ui-skills
  headers:
    - name: X-API-Version
      value: 2.0.0
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "Learn more button",
        "component_type": "cta_url",
        "status": "enabled",
        "instruction": "When a customer asks to learn more, send a button labeled Learn more that opens https://www.example.com."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Creates a UI skill. For `flow`, also provide the numeric `flow_id`; omit it for all other component types.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/ui-skills
