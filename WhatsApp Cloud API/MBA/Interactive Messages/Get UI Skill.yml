info:
  name: Get UI Skill
  type: http
  seq: 2

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent-ui-skills/{{MBA-UI-Skill-ID}}
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Retrieves one UI skill by ID.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/ui-skills
