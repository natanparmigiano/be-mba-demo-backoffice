info:
  name: Get Evaluation Details
  type: http
  seq: 7

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent-eval/details?eval_ids={{MBA-Eval-IDs}}
  headers:
    - name: X-API-Version
      value: 2.0.0
  params:
    - name: eval_ids
      value: "{{MBA-Eval-IDs}}"
      type: query
      description: Comma-separated evaluation IDs
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Retrieves per-conversation results for the selected evaluation IDs.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/operate/agent-eval
