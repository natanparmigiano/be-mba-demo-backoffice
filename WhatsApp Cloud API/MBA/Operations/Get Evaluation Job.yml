info:
  name: Get Evaluation Job
  type: http
  seq: 6

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent-eval/run?job_id={{MBA-Eval-Job-ID}}
  headers:
    - name: X-API-Version
      value: 2.0.0
  params:
    - name: job_id
      value: "{{MBA-Eval-Job-ID}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Polls the status and result of a submitted evaluation job.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/operate/agent-eval
