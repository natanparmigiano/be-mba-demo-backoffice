info:
  name: Run Agent Test
  type: http
  seq: 1

http:
  method: POST
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_test
  headers:
    - name: X-API-Version
      value: 2.0.0
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "user_msg": "What are your opening hours?"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Sends a synchronous test message through the full agent pipeline. To continue a multi-turn test, add the `conversation_id` returned by the previous response. Limit: 500 per entity and 10,000 per app per hour.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/operate/agent-test
