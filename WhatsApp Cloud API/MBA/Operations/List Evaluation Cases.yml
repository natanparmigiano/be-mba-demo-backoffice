info:
  name: List Evaluation Cases
  type: http
  seq: 4

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent-eval/cases
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Lists the evaluation scenarios available for the entity.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/operate/agent-eval
