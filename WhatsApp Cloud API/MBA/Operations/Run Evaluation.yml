info:
  name: Run Evaluation
  type: http
  seq: 5

http:
  method: POST
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent-eval/run?eval_case_ids={{MBA-Eval-Case-IDs}}
  headers:
    - name: X-API-Version
      value: 2.0.0
    - name: Content-Type
      value: application/json
  params:
    - name: eval_case_ids
      value: "{{MBA-Eval-Case-IDs}}"
      type: query
      description: Comma-separated evaluation case IDs
  body:
    type: json
    data: "{}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Starts an asynchronous evaluation job for the selected cases and returns a job ID.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/operate/agent-eval
