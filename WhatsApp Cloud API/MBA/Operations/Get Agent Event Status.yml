info:
  name: Get Agent Event Status
  type: http
  seq: 3

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_event/{{MBA-Agent-Event-ID}}
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Retrieves the processing status of a submitted agent event.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/operate/agent-event
