info:
  name: Get Evaluation Summary
  type: http
  seq: 8

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent-eval/summary?summary_ids={{MBA-Eval-Summary-IDs}}
  headers:
    - name: X-API-Version
      value: 2.0.0
  params:
    - name: summary_ids
      value: "{{MBA-Eval-Summary-IDs}}"
      type: query
      description: Comma-separated evaluation summary IDs
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Retrieves aggregate reports for the selected evaluation summary IDs.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/operate/agent-eval
