info:
  name: Get Conversation Insights
  type: http
  seq: 3

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/insights/conversations?start_date={{MBA-Start-Date}}&end_date={{MBA-End-Date}}
  headers:
    - name: X-API-Version
      value: 2.0.0
  params:
    - name: start_date
      value: "{{MBA-Start-Date}}"
      type: query
    - name: end_date
      value: "{{MBA-End-Date}}"
      type: query
    - name: metrics
      value: ai_threads
      type: query
      disabled: true
      description: Optional metrics filter; repeat the parameter for each metric
    - name: metrics
      value: ai_handoffs
      type: query
      disabled: true
      description: Optional metrics filter; repeat the parameter for each metric
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Returns conversation and current-handoff counts for an inclusive date range of at most 90 days.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/insights/conversation-insights
