info:
  name: Get Agent Event Insights
  type: http
  seq: 1

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/insights/agent_events?start_date={{MBA-Start-Date}}&end_date={{MBA-End-Date}}
  headers:
    - name: X-API-Version
      value: 2.0.0
  params:
    - name: start_date
      value: "{{MBA-Start-Date}}"
      type: query
    - name: end_date
      value: "{{MBA-End-Date}}"
      type: query
    - name: event_type
      value: order_shipped
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Returns event volume, completion, and latency by event type for an inclusive date range of at most 30 days.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/insights/agent-event-insights
