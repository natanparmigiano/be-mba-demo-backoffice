info:
  name: Get Conversation Turns
  type: http
  seq: 2

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/insights/conversations/turns?user_phone_number={{MBA-Consumer-ID}}
  headers:
    - name: X-API-Version
      value: 2.0.0
  params:
    - name: user_phone_number
      value: "{{MBA-Consumer-ID}}"
      type: query
      description: Digits-only phone number, BSUID, or Agent Test conversation ID
    - name: start_timestamp_ms
      value: ""
      type: query
      disabled: true
    - name: end_timestamp_ms
      value: ""
      type: query
      disabled: true
    - name: before
      value: ""
      type: query
      disabled: true
    - name: after
      value: ""
      type: query
      disabled: true
    - name: limit
      value: "25"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Retrieves ordered turns from the consumer's most recent conversation. For WhatsApp use a digits-only phone number, a BSUID, or an Agent Test conversation ID.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/insights/conversation-turns
