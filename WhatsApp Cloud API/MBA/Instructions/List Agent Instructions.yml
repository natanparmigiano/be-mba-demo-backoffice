info:
  name: List Agent Instructions
  type: http
  seq: 1

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/skills
  headers:
    - name: X-API-Version
      value: 2.0.0
  params:
    - name: agent_id
      value: "{{MBA-Agent-ID}}"
      type: query
      disabled: true
      description: Optional agent settings ID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Lists all behavioral instructions (called skills by the API) for the agent.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/agent-skills
