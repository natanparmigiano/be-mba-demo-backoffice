info:
  name: Create Agent Instruction
  type: http
  seq: 3

http:
  method: POST
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/skills
  headers:
    - name: X-API-Version
      value: 2.0.0
    - name: Content-Type
      value: application/json
  params:
    - name: agent_id
      value: "{{MBA-Agent-ID}}"
      type: query
      disabled: true
      description: Optional agent settings ID
  body:
    type: json
    data: |-
      {
        "title": "greeting-skill",
        "description": "Apply when the customer first messages the agent.",
        "skill": "Greet the customer warmly, identify the business, and ask how you can help."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Creates a scoped behavioral instruction. Titles use lowercase letters, numbers, and hyphens and are limited to 64 characters.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/agent-skills
