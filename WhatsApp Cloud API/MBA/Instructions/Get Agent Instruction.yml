info:
  name: Get Agent Instruction
  type: http
  seq: 2

http:
  method: GET
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/skills/{{MBA-Skill-ID}}
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Retrieves one instruction by its skill ID.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/agent-skills
