info:
  name: Update Agent Instruction
  type: http
  seq: 4

http:
  method: PUT
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_config/skills/{{MBA-Skill-ID}}
  headers:
    - name: X-API-Version
      value: 2.0.0
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "greeting-skill",
        "description": "Apply when the customer first messages the agent.",
        "skill": "Greet the customer warmly, identify the business, and ask how you can help."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Partially updates the selected instruction; omitted fields retain their current values.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/agent-skills
