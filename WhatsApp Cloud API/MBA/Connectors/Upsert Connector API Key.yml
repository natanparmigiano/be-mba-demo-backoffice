info:
  name: Upsert Connector API Key
  type: http
  seq: 8

http:
  method: POST
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_connectors/{{MBA-Connector-ID}}/upsertApiKey
  headers:
    - name: X-API-Version
      value: 2.0.0
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "api_key_config": {
          "headers": [
            {
              "field_name": "X-API-Key",
              "value": "<API_KEY>",
              "prefix": ""
            }
          ],
          "query_params": [],
          "body_params": []
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Sets or rotates the selected connector's API-key credentials. Replace the placeholder locally; never commit a real secret.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/connectors
