info:
  name: Upsert Connector OAuth Credentials
  type: http
  seq: 9

http:
  method: POST
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_connectors/{{MBA-Connector-ID}}/upsertOAuth
  headers:
    - name: X-API-Version
      value: 2.0.0
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "oauth_config": {
          "token_url": "https://api.example.com/oauth/token",
          "scopes_to_request": ["read"],
          "token_request_content_type": "application/x-www-form-urlencoded",
          "client_id": "<CLIENT_ID>",
          "client_secret": "<CLIENT_SECRET>"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Sets or rotates OAuth 2.0 client credentials. Replace placeholders locally; never commit real credentials.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/connectors
