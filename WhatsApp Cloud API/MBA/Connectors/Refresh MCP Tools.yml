info:
  name: Refresh MCP Tools
  type: http
  seq: 7

http:
  method: POST
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_connectors/{{MBA-Connector-ID}}/refreshMCPTools
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Rediscovers a remote MCP server's tools and reconciles the cached connector actions.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/connectors
