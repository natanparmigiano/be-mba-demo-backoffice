info:
  name: Delete Connector
  type: http
  seq: 5

http:
  method: DELETE
  url: https://api.facebook.com/{{Phone-Number-ID}}/agent_connectors/{{MBA-Connector-ID}}
  headers:
    - name: X-API-Version
      value: 2.0.0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Deletes the selected connector and makes its operations unavailable to the agent.

  Reference: https://developers.facebook.com/documentation/meta-business-agent/reference/configure/connectors
