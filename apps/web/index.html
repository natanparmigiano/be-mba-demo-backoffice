<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/signifier.png" />
    <meta name="theme-color" content="#f3f4f5" />
    <meta
      name="description"
      content="React frontend powered by a typed Hono API"
    />
    <title>MBA Demo Backoffice</title>
    <script>
      ;(() => {
        let preference = 'system'
        try {
          preference = localStorage.getItem('mba-theme') ?? 'system'
        } catch {
          // Use the operating-system preference when storage is unavailable.
        }
        const theme =
          preference === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference
        document.documentElement.dataset.theme = theme
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
