$schema: 'https://json-schema.org/draft/2020-12/schema'
$id: 'https://mba-desk.example/schemas/mcpx/v1/mcp.schema.json'
title: 'MCPX package'
description: 'Schema for an MCPX version 1 YAML document.'
type: object
additionalProperties: false
required:
  - format
  - version
  - mcp
properties:
  format:
    const: mba-mcp
  version:
    const: 1
  mcp:
    $ref: '#/$defs/mcp'
$defs:
  mcp:
    type: object
    additionalProperties: false
    required:
      - name
      - description
      - functions
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
      description:
        type:
          - string
          - 'null'
        maxLength: 2000
      functions:
        type: array
        minItems: 1
        maxItems: 1000
        items:
          $ref: '#/$defs/function'
  function:
    type: object
    additionalProperties: false
    required:
      - name
      - description
      - currentRevision
      - revisions
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '^[a-z0-9]+(?:_{1,2}[a-z0-9]+)*$'
      description:
        type:
          - string
          - 'null'
        maxLength: 2000
      currentRevision:
        type: integer
        minimum: 1
        description: 'Must equal the revision number of the final revisions entry.'
      revisions:
        type: array
        minItems: 1
        maxItems: 1000
        description: 'Must be ordered and numbered contiguously from 1.'
        items:
          $ref: '#/$defs/revision'
  revision:
    type: object
    additionalProperties: false
    required:
      - revision
      - code
      - parameters
      - createdAt
    properties:
      revision:
        type: integer
        minimum: 1
      code:
        type: string
        minLength: 1
        maxLength: 100000
      parameters:
        type: array
        maxItems: 100
        items:
          $ref: '#/$defs/parameter'
      createdAt:
        type: string
        format: date-time
  parameter:
    type: object
    additionalProperties: false
    required:
      - name
      - type
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[A-Za-z_$][A-Za-z0-9_$]*$'
      type:
        enum:
          - boolean
          - integer
          - json
          - number
          - string
      required:
        type: boolean
        default: true
      description:
        type:
          - string
          - 'null'
        maxLength: 500
