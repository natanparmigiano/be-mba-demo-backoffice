x-app: &app
  image: mba-demo-backoffice:local
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mba_demo_backoffice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mba_demo_backoffice']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 && /opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    volumes:
      - kafka-data:/var/lib/kafka/data

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    command: ['server', '/data', '--console-address', ':9001']
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --spider http://localhost:9000/minio/health/live',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - minio-data:/data

  app:
    <<: *app
    command: ['app']
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mba_demo_backoffice
      REDIS_URL: redis://redis:6379
      KAFKA_CLIENT_ID: mba-demo-app
      KAFKA_BROKERS: kafka:9092
      FILES_ADAPTER: s3
      FILES_S3_BUCKET: ${FILES_S3_BUCKET:-mba-demo-files}
      FILES_S3_CREATE_BUCKET: 'true'
      FILES_S3_REGION: us-east-1
      FILES_S3_ENDPOINT: http://minio:9000
      FILES_S3_PUBLIC_ENDPOINT: ${FILES_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      FILES_S3_FORCE_PATH_STYLE: 'true'
      FILES_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      FILES_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ENABLE_WORKER_IN_PROCESS: 'false'
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-development-only-secret-change-before-production}
      BETTER_AUTH_URL: ${COMPOSE_BETTER_AUTH_URL:-http://localhost:8080}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      CORS_ORIGIN: ${COMPOSE_CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:8080'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  worker:
    <<: *app
    command: ['worker']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mba_demo_backoffice
      KAFKA_CLIENT_ID: mba-demo-worker
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: mba-demo-worker-consumer
      SUBSCRIBE_TO_TOPICS: ${SUBSCRIBE_TO_TOPICS:-all}
      WA_WEBHOOK_MAX_RETRIES: ${WA_WEBHOOK_MAX_RETRIES:-5}
      FILES_ADAPTER: s3
      FILES_S3_BUCKET: ${FILES_S3_BUCKET:-mba-demo-files}
      FILES_S3_CREATE_BUCKET: 'true'
      FILES_S3_REGION: us-east-1
      FILES_S3_ENDPOINT: http://minio:9000
      FILES_S3_PUBLIC_ENDPOINT: ${FILES_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      FILES_S3_FORCE_PATH_STYLE: 'true'
      FILES_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      FILES_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      app:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  kafka-data:
  minio-data:
  postgres-data:
  redis-data:
