services:
  - type: web
    name: mba-desk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mba-desk-postgres
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mba-desk-redis
          property: connectionString
      - key: ENABLE_WORKER_IN_PROCESS
        value: 'true'
      - key: SUBSCRIBE_TO_TOPICS
        value: all
      - key: WA_WEBHOOK_MAX_RETRIES
        value: '5'
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FILES_ADAPTER
        # Demo-only fallback for a diskless Render service. Do not use the
        # PostgreSQL blob driver for production; configure S3 instead.
        value: postgres
      - key: FILES_PUBLIC_URL
        sync: false
      - key: FILES_SIGNING_SECRET
        generateValue: true
  - type: keyvalue
    name: mba-desk-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: mba-desk-postgres
    plan: free
    databaseName: mba_desk
    user: mba_desk
    ipAllowList: []
