services:
  - type: web
    name: mba-demo-backoffice
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: app
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mba-demo-backoffice-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mba-demo-backoffice-redis
          property: connectionString
      - key: ENABLE_WORKER_IN_PROCESS
        value: 'true'
      - key: SUBSCRIBE_TO_TOPICS
        value: all
      - key: WA_WEBHOOK_MAX_RETRIES
        value: '5'
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: MCP_ALLOWED_HOSTS
        sync: false
      - key: FILES_ADAPTER
        value: fs
      - key: FILES_DIRECTORY
        value: /var/data/files
      - key: FILES_PUBLIC_URL
        sync: false
      - key: FILES_SIGNING_SECRET
        generateValue: true
    disk:
      name: mba-demo-backoffice-files
      mountPath: /var/data
      sizeGB: 1

  - type: keyvalue
    name: mba-demo-backoffice-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: mba-demo-backoffice-postgres
    plan: free
    databaseName: mba_demo_backoffice
    user: mba_demo_backoffice
    ipAllowList: []
