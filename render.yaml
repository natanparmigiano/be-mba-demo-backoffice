services:
  - type: web
    name: mba-demo-backoffice
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: app
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mba-demo-backoffice-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mba-demo-backoffice-redis
          property: connectionString
      - key: ENABLE_WORKER_IN_PROCESS
        value: 'true'
      - key: SUBSCRIBE_TO_TOPICS
        value: all
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: keyvalue
    name: mba-demo-backoffice-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: mba-demo-backoffice-postgres
    plan: free
    databaseName: mba_demo_backoffice
    user: mba_demo_backoffice
    ipAllowList: []
